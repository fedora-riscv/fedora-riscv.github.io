<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">{{ i18n "skip" }}</a>
<div class="progress" id="progress" aria-hidden="true"></div>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
<p class="sr" id="announce" aria-live="polite"></p>
{{ with resources.Get "js/main.js" | js.Build (dict "minify" true) | fingerprint }}<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>{{ end }}
</body>
</html>
