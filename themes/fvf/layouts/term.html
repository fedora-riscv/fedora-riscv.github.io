{{ define "main" }}
<div class="doc-head"><div class="wrap">
  <nav class="crumbs" aria-label="{{ i18n "nav_crumbs" }}"><a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a><span>/</span><a href="{{ .Parent.RelPermalink }}">{{ i18n "tags" }}</a><span>/</span><span>{{ .Title }}</span></nav>
  <h1 class="big-title">{{ .Title }}</h1>
  <p class="sub">{{ i18n "post_count" (len .Pages) }}</p>
</div></div>
<div class="wrap list-page">
  <ul class="linklist">
  {{- range .Pages }}{{ $m := partial "meta.html" . }}
    <li><a href="{{ .RelPermalink }}"><span>{{ with $m.n }}<span class="cat">{{ . }}</span>{{ end }}{{ $m.title }}</span><span>{{ .Date.Format "2006-01-02" }}</span></a></li>
  {{- end }}
  </ul>
</div>
{{ end }}
