{{ define "main" }}
<div class="wrap nf">
  <strong>404</strong>
  <h1 style="margin:0;font-size:28px">{{ i18n "nf_title" }}</h1>
  <p style="margin:0;color:var(--muted)">{{ i18n "nf_text" }}</p>
  <div class="cta-row"><a class="btn-lg gold" href="{{ site.Home.RelPermalink }}">{{ i18n "nf_home" }}</a>{{ with site.GetPage "/archive" }}<a class="btn-lg ink" href="{{ .RelPermalink }}">{{ i18n "nf_all" }}</a>{{ end }}</div>
</div>
{{ end }}
