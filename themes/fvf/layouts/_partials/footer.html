<footer><div class="wrap">
  <a class="fbrand" href="{{ site.Home.RelPermalink }}"><img src="{{ "images/fvf-mark-white.png" | relURL }}" alt="" width="16" height="30"><span>{{ site.Title }}</span></a>
  <nav aria-label="{{ i18n "nav_footer" }}">
    <a href="{{ site.Params.website }}">{{ i18n "footer_web" }}</a>
    <a href="{{ site.Params.images }}">{{ i18n "footer_images" }}</a>
    <a href="{{ site.Params.telegram }}">Telegram</a>
    <a href="{{ site.Params.github }}">GitHub</a>
    {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}" data-no-pjax>RSS</a>{{ end }}
  </nav>
  <p class="copy">{{ site.Title }} · {{ site.Params.subtitle }} · Built with Hugo · {{ i18n "footer_license" }}</p>
</div></footer>
