baseURL = 'https://blog.fedoravforce.com/'
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
title = 'Fedora-V Force'
theme = 'fvf'
enableRobotsTXT = true

ignoreFiles = ['README\.md$', 'LICENSE$']

[taxonomies]
tag = 'tags'

[outputs]
home = ['html', 'rss']
section = ['html', 'rss']
taxonomy = ['html']
term = ['html', 'rss']

[markup.goldmark.renderer]
# The devel docs (a trusted, FVF-maintained submodule) use <br /> inside table
# cells. The theme removes the legacy <div><font size='20'> heading wrapper.
unsafe = true

[markup.tableOfContents]
startLevel = 1
endLevel = 2
ordered = false

[markup.highlight]
noClasses = false
guessSyntax = false

[params]
author = 'Fedora-V Force'
github = 'https://github.com/fedora-riscv'
siteRepo = 'https://github.com/fedora-riscv/fedora-riscv.github.io'
website = 'https://www.fedoravforce.org/'
images = 'https://images.fedoravforce.org/'
telegram = 'https://t.me/fedorariscv'
telegramName = 'Fedora RISC-V (Fedora-V Force)'
discussions = 'https://github.com/fedora-riscv/Discussions/discussions'

# Assembled by JavaScript so the address does not appear in the HTML source.
[params.contact]
emailUser = 'support'
emailDomain = 'fedoravforce.org'

[params.giscus]
repo = 'fedora-riscv/Discussions'
repoId = 'R_kgDOHBir1Q'
category = 'Blog Comments'
categoryId = 'DIC_kwDOHBir1c4DK0BR'
# Threads are keyed by the Chinese page's path, so both languages share one.
mapping = 'specific'
